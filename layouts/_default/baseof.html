<!doctype html>
<html
  lang="{{ .Site.Language.Lang }}"
  dir="{{ .Site.Language.Params.direction | default .Site.Language.LanguageDirection | default `ltr` }}"
>
  <head>
    {{ partial "head.html" . }}
  </head>
  <body>
    {{ $resolved := partial "resume/resolve.html" . }}
    {{ .Scratch.Set "resumeResolved" $resolved }}
    {{ partial "site-header.html" (dict "page" . "resolved" $resolved) }}
    {{ block "main" . }}{{ end }}
    {{ partial "site-footer.html" (dict "page" . "resolved" $resolved) }}
  </body>
</html>
