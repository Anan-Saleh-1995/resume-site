<!doctype html>
<html
  lang="{{ .Site.Language.Lang }}"
  dir="{{ .Site.Language.Params.direction | default .Site.Language.LanguageDirection | default `ltr` }}"
>
  <head>
    {{ partial "head.html" . }}
  </head>
  <body>
    {{ $resolved := partial "resume/resolve.html" . }} {{ partial
    "site-header.html" (dict "page" . "resolved" $resolved) }} {{ block "main" .
    }}{{ end }} {{ partial "site-footer.html" (dict "page" . "resolved"
    $resolved) }}
    <script>
      (() => {
        const button = document.querySelector('.theme-toggle');
        if (!button) return;

        const root = document.documentElement;

        const getTheme = () => root.dataset.theme || 'system';

        const updateLabel = () => {
          const theme = getTheme();
          button.setAttribute(
            'aria-label',
            theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode',
          );
        };

        button.addEventListener('click', () => {
          const current = getTheme();
          const next = current === 'dark' ? 'light' : 'dark';
          root.dataset.theme = next;
          localStorage.setItem('theme', next);
          updateLabel();
        });

        updateLabel();
      })();
    </script>
  </body>
</html>
