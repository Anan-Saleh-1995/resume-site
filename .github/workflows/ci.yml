name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      HUGO_SHOW_PRIVATE_CONTACT: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.159.1'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Upload public artifact
        uses: actions/upload-artifact@v4
        with:
          name: public-site
          path: public
